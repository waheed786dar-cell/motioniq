name: Close Stale Issues

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: 'stale'
          stale-issue-message: 'This issue has been inactive for 30 days and will close in 7 days unless updated.'
          stale-pr-message: 'This PR has been inactive for 30 days and will close in 7 days unless updated.'
          exempt-issue-labels: 'pinned,security'
